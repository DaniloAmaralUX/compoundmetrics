name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Evidence infrastructure: registry lint (with mutation self-test) and
      # the deterministic E1 contract suite. Neither spends model/API budget.
      - name: registry lint
        run: npm run cd:lint
      - name: contract evals
        run: npm run cd:evals

      # App
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
