- description: Accessible action and form clarity
  vars:
    request: |
      Review this React interface for material interface-quality issues only. Prioritize the smallest set of changes that materially improve clarity, accessibility and task completion.

      ```tsx
      export function InviteMember() {
        return (
          <div className="w-[420px] p-4">
            <h3>Invite</h3>
            <input placeholder="Email" className="h-8 w-full border" />
            <div onClick={() => invite()} className="mt-3 inline-flex h-8 items-center px-3 bg-black text-white">OK</div>
            <p className="text-xs text-gray-400">Oops! Something went wrong.</p>
          </div>
        )
      }
      ```
  assert:
    - type: icontains-any
      value: ["button", "keyboard", "semantic"]
    - type: icontains-any
      value: ["label", "placeholder"]
    - type: icontains-any
      value: ["OK", "Invite", "action"]
    - type: icontains-any
      value: ["error", "recover", "fix"]

- description: Responsive overflow and hierarchy
  vars:
    request: |
      Review this dashboard shell for the highest-leverage interface issues. Do not invent product requirements.

      ```tsx
      <main className="grid grid-cols-[280px_1fr] min-w-[1180px] gap-8 p-8">
        <aside>Navigation</aside>
        <section>
          <div className="flex items-center justify-between">
            <p className="text-3xl font-semibold">Customers</p>
            <button className="h-8 px-3">New customer</button>
          </div>
          <div className="mt-8 grid grid-cols-4 gap-2">...</div>
        </section>
      </main>
      ```
  assert:
    - type: icontains-any
      value: ["responsive", "overflow", "min-w", "mobile", "narrow"]
    - type: icontains-any
      value: ["heading", "h1", "hierarchy"]

- description: Writing and destructive confirmation
  vars:
    request: |
      Review only the user-facing interface copy and action clarity in this deletion flow.

      Dialog title: "Are you sure?"
      Body: "This might remove stuff from your account forever!"
      Primary button: "Yes"
      Secondary button: "No"
      Error after failure: "Oops! Something went wrong."
  assert:
    - type: icontains-any
      value: ["Delete", "Remove", "consequence"]
    - type: icontains-any
      value: ["Cancel", "secondary"]
    - type: icontains-any
      value: ["try again", "recover", "error"]

- description: Systemic visual issue should be consolidated
  vars:
    request: |
      Review this UI pattern. The same card appears 18 times in one page.

      Every card uses `rounded-2xl p-2`; each inner action also uses `rounded-2xl`; card borders are `border-black/5` in light mode and the action text is `text-zinc-400` on white. Report root causes rather than listing all 18 cards individually.
  assert:
    - type: icontains-any
      value: ["radius", "concentric", "nested"]
    - type: icontains-any
      value: ["contrast", "color"]
    - type: javascript
      value: |
        const s = String(output).toLowerCase();
        const occurrences = (s.match(/18/g) || []).length;
        return occurrences <= 3;

- description: Near miss — backend-only request
  vars:
    request: |
      Review this PostgreSQL migration strategy for lock duration, index creation and rollback safety. There is no user-facing interface change.
  assert:
    - type: icontains-any
      value: ["outside", "backend", "not an interface", "code review", "database"]

- description: Near miss — motion-only critique
  vars:
    request: |
      The interface structure is approved. Review only whether a spring animation on a modal exit is interruptible, physically coherent and appropriate. Do not perform a general UI review.
  assert:
    - type: icontains-any
      value: ["motion", "animation", "emi", "specialist", "outside"]

- description: Holdout — mixed states and accessibility
  vars:
    request: |
      Review this search results component. Treat it as a holdout case and prioritize only material findings.

      ```tsx
      function Results({ loading, items }) {
        if (loading) return <div className="animate-pulse">Loading...</div>
        if (!items.length) return <div>No results.</div>
        return <div className="grid grid-cols-3">{items.map(x => <div onClick={() => open(x.id)}>{x.name}</div>)}</div>
      }
      ```
  assert:
    - type: icontains-any
      value: ["button", "keyboard", "interactive"]
    - type: icontains-any
      value: ["empty", "No results", "next action", "search"]
    - type: icontains-any
      value: ["key", "map", "React", "correctness", "code review"]

- description: Holdout — AI autonomy concern should be deferred
  vars:
    request: |
      Review whether this interface should let an AI agent automatically delete duplicate customer records after it predicts a 92% match. The visual layout is already approved.
  assert:
    - type: icontains-any
      value: ["AI", "autonomy", "approval", "reversible", "cd-ai-interaction-review", "specialist"]
