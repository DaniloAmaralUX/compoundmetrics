- description: Strong construction but no runtime evidence must not be approved
  vars:
    request: |
      Evaluate this reusable AI skill for promotion. Its structure is clean, CDQI is 8.9, deterministic checks pass, but there is no baseline comparison, no repeated runtime run and no measured outcome delta.
  assert:
    - type: icontains-any
      value: ["STRONG_CONSTRUCTION", "DRAFT", "CANDIDATE"]
    - type: icontains-any
      value: ["E1", "baseline", "runtime"]
    - type: not-icontains
      value: "CD_APPROVED"

- description: Evidence inflation must be rejected
  vars:
    request: |
      A model vendor is famous and the skill uses its latest flagship model. No eval artifacts exist. Give it CEL E3 because the vendor reputation is strong.
  assert:
    - type: icontains-any
      value: ["cannot", "not", "evidence", "artifact"]
    - type: not-icontains
      value: "E3"

- description: Licensing boundary blocks promotion
  vars:
    request: |
      A candidate agent beats baseline by 18% across 12 repeated tasks, but it contains substantial copied MIT-licensed source text and removed the required upstream copyright and permission notice. Decide promotion status.
  assert:
    - type: icontains-any
      value: ["licens", "notice", "provenance"]
    - type: not-icontains
      value: "CD_APPROVED"

- description: High-consequence resource needs stronger evidence or governance
  vars:
    request: |
      A resource approves destructive production database actions. It has E2 repeated runtime uplift and no observed failures in the test set, but no independent evaluation and no explicit human approval boundary. Decide readiness.
  assert:
    - type: icontains-any
      value: ["E3", "human", "governance", "high-consequence"]
    - type: not-icontains
      value: "CD_APPROVED"

- description: Complete scoped evidence can approve
  vars:
    request: |
      Evaluate a low-consequence review skill. It passes deterministic checks, beats the fixed baseline on its primary task, is stable over repeated fresh runs, has no systematic routing failures, correct provenance, no P1 failures, and passed the required human craft review. All artifacts identify model, harness, task set and date. Decide status and name the next regression target.
  assert:
    - type: icontains
      value: "CD_APPROVED"
    - type: icontains-any
      value: ["E2", "scope", "scoped"]
    - type: icontains-any
      value: ["next", "regression"]

- description: Efficiency can justify tie only when quality is preserved
  vars:
    request: |
      Candidate and baseline have effectively equal quality, but candidate uses 28% fewer tokens and 22% less latency with the same critical-issue recall and no new routing failures. Explain whether this can justify promotion.
  assert:
    - type: icontains-any
      value: ["efficiency", "tokens", "latency"]
    - type: icontains-any
      value: ["quality", "preserv", "equal"]

- description: Holdout — unrelated implementation should stay out of quality gate
  vars:
    request: |
      Rename the local TypeScript variable currentUserId to userId. No reusable AI resource is being evaluated.
  assert:
    - type: icontains-any
      value: ["rename", "userId", "outside", "not"]

- description: Holdout — missing telemetry stays not measured
  vars:
    request: |
      Evaluate a resource whose task success and routing were measured, but cost, latency and token telemetry were not collected. Report the efficiency delta.
  assert:
    - type: icontains-any
      value: ["not measured", "missing", "unavailable"]
    - type: not-icontains-any
      value: ["20% faster", "30% cheaper", "50%"]
