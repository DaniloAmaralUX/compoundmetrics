description: Compound Design E2 — cd-quality-gate controlled benchmark

prompts:
  - '{{request}}'

providers:
  - id: anthropic:claude-agent-sdk
    label: A-base-model
    config:
      model: '{{env.CD_EVAL_MODEL | default("claude-sonnet-4-6")}}'
      working_dir: ../../..
      apiKeyRequired: false
      strict_mcp_config: true
      persist_session: false
      exclude_dynamic_sections: true
      tools: [Read, Grep, Glob, LS]
      max_turns: 6
      max_budget_usd: 0.25

  - id: anthropic:claude-agent-sdk
    label: C-cd-quality-gate-v0.2
    config:
      model: '{{env.CD_EVAL_MODEL | default("claude-sonnet-4-6")}}'
      working_dir: ../../..
      apiKeyRequired: false
      strict_mcp_config: true
      persist_session: false
      exclude_dynamic_sections: true
      setting_sources: ['project']
      skills: ['cd-quality-gate']
      tools: [Read, Grep, Glob, LS, Skill]
      max_turns: 6
      max_budget_usd: 0.25

defaultTest:
  options:
    repeat: 3

tests:
  - file://cd-quality-gate-tests.yaml

outputPath:
  - results/cd-quality-gate-e2.json
  - results/cd-quality-gate-e2.html

# Optional B comparator may be added only when a genuinely comparable external evaluator
# is pinned and its environment can be held constant. Do not label a generic model judge
# as an equivalent quality gate merely to force an A/B/C shape.
#
# Run:
# npx promptfoo@latest eval -c compound-design/quality/e2/promptfoo-quality-gate.yaml --no-cache
#
# Do not execute paid API runs without explicit budget approval.
